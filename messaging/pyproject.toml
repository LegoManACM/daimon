[project]
name = "daimon-messages"
version = "0.1.0"
description = "Text messages (Google Messages) for Daimon: a service that stores them and an MCP server to look them up"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "segno>=1.6",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
daimon-messages = "daimon_messages.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daimon_messages"]

[tool.hatch.build.targets.wheel.force-include]
# the Go source, so an installed copy can still build the sidecar if the prebuilt one can't be downloaded
"sidecar/gmessages/main.go" = "daimon_messages/gmessages/main.go"
"sidecar/gmessages/go.mod" = "daimon_messages/gmessages/go.mod"
"sidecar/gmessages/go.sum" = "daimon_messages/gmessages/go.sum"

[tool.pytest.ini_options]
testpaths = ["tests"]
