[project]
name = "daimon"
version = "0.1.2"
description = "A background agent driven by markdown it can edit itself"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.60",
    "mcp>=2.0",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0",
    "httpx>=0.27",
    "claude-agent-sdk>=0.2",  # the built-in claude-code harness
    "questionary>=2.0",       # daimon setup
    "rich>=13",
]

[project.scripts]
daimon = "daimon.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daimon"]
