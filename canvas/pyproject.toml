[project]
name = "daimon-canvas"
version = "0.2.0"
description = "Canvas LMS for Daimon: an MCP server for your classes, homework, grades and course files"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0",  # secrets show as * while typed
    "pymupdf>=1.24",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
daimon-canvas = "daimon_canvas.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daimon_canvas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
