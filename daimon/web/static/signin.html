<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Daimon</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root { --bg: #0e0f13; --panel: #15171d; --line: #323745; --text: #e6e8ee; --muted: #8b91a1; --ember: #f2a65a; --err: #ef6f6c; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root { --bg: #f6f5f2; --panel: #fff; --line: #d6d3cb; --text: #1c1d21; --muted: #6a6e78; --ember: #c8701c; --err: #c9423f; color-scheme: light; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
form { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 26px 22px; }
.sigil { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, var(--ember) 0 28%, transparent 30%); box-shadow: 0 0 0 1px var(--ember); margin-bottom: 14px; }
h1 { font-size: 18px; margin: 0 0 6px; }
p { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }
code { font: 12.5px ui-monospace, Consolas, monospace; }
input { width: 100%; font: 16px ui-monospace, Consolas, monospace; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
input:focus { outline: 2px solid var(--ember); border-color: transparent; }
button { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 10px; background: var(--ember); color: #1a1208; font: 600 15px system-ui, sans-serif; cursor: pointer; }
.err { color: var(--err); font-size: 13px; margin: 10px 0 0; min-height: 1em; }
</style>
</head>
<body>
<form id="f">
  <div class="sigil"></div>
  <h1>Sign in to Daimon</h1>
  <p>Paste the sign-in token. It's <code>WEB_TOKEN</code> in the secrets file on the computer running Daimon, and <code>daimon config web</code> shows a link that signs you in. Each browser signs in once.</p>
  <input id="t" name="token" type="password" autocomplete="current-password" placeholder="Token" autofocus>
  <button>Sign in</button>
  <div class="err" id="e"></div>
</form>
<script>
if (location.search.includes("wrong=1")) document.getElementById("e").textContent = "That token isn't right.";
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const e = document.getElementById("e"); e.textContent = "";
  const r = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: document.getElementById("t").value }) });
  if (r.ok) location.replace("/"); else e.textContent = (await r.json().catch(() => ({}))).error || "Couldn't sign in.";
});
</script>
</body>
</html>
